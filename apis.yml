name: Unamo
description: Unamo was a Warsaw, Poland based SaaS suite offering SEO monitoring, social
  media monitoring, and conversion rate optimization, formerly known as Positionly,
  and backed by Point Nine Capital. The company appears defunct as of July 2026, with
  unamo.com no longer resolving in DNS and the pre-rebrand positionly.com site serving
  stale 2017-era content whose API, signup, terms, and privacy pages return 404. No
  public API surface, client packages, or developer documentation remain online.
